# Reverse proxy in front of the app. Terminates TLS, serves as the only public entry point,
# and adds the timeouts/headers the app itself doesn't set.
#
# To enable HTTPS: point a domain at this server, then run certbot (see DEPLOY.md). Certbot
# rewrites this file's server blocks for you; the ACME challenge location below is what lets it
# verify the domain without stopping nginx.

# Docker's embedded DNS server. nginx resolves an upstream hostname ONCE at startup unless it
# is told otherwise, so recreating the app container (any `docker compose up -d` that rebuilds
# it) left nginx connecting to the old, dead container IP and returning 502 until nginx itself
# was restarted. Resolving through 127.0.0.11 with a short TTL, via the variable below, makes
# nginx pick up the new IP on its own.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Compression. The React bundle is ~1.5 MB of JavaScript and compresses to roughly a quarter of
# that, and it is by far the largest thing the site serves - so this matters more to how fast the
# app feels on a school connection than the server's link speed does. text/html is always
# compressed by nginx and must not be listed here.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

server {
    listen 80;
    server_name _;

    # Matches Flask's MAX_CONTENT_LENGTH (10 MB) so oversized uploads are rejected at the edge
    # rather than after being streamed all the way to the app.
    client_max_body_size 10M;

    # Let certbot answer the HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security headers. No HSTS here on purpose - only add it once TLS actually works, or
    # browsers will refuse to load the site over HTTP and lock you out.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Create React App puts a content hash in every bundle filename, so these files can never
    # change under a given URL - a new build produces new names. That makes them safe to cache
    # permanently, which means a returning student re-downloads nothing at all and a whole class
    # arriving at 9am costs almost no traffic. index.html is deliberately NOT cached this way:
    # it is what points at the current bundle names.
    location /static/ {
        set $app_upstream_static http://language-learning-app:5001;
        proxy_pass $app_upstream_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header in a location REPLACES the inherited ones rather than adding to them, so the
        # server-level security headers have to be repeated here or these paths would lose them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # The variable is what forces runtime re-resolution (see the resolver note above).
        set $app_upstream http://language-learning-app:5001;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A submission runs the neural network inline and can take minutes when a whole class
        # submits together. Anything shorter here shows students a 504 while the backend is
        # still working. Keep this above gunicorn's own timeout.
        proxy_connect_timeout 75s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }
}

