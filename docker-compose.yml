services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: language_learning_app
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  language-learning-app:
    build: .
    # Not published to the host in production - nginx is the only public entry point and
    # reaches this over the compose network. Uncomment to hit the app directly while debugging.
    # ports:
    #   - "5001:5001"
    expose:
      - "5001"
    volumes:
      - app_uploads:/app/uploads
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - DB_USER=app_user
      - DB_PASSWORD=app_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=language_learning_app
      - DATABASE_URL=postgresql://app_user:app_password@postgres:5432/language_learning_app
      # Read from .env (gitignored). The old hardcoded placeholders were committed to the
      # repo, so anyone with repo access could forge a JWT for any account.
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      - FLASK_DEBUG=False
      - UPLOAD_FOLDER=/app/uploads
      - NEURAL_NETWORK_MODEL_PATH=Zlovoblachko/REAlEC_2step_model_testing
      - GED_MODEL_PATH=Zlovoblachko/11tag-electra-grammar-stage2
      # Read from the .env file in this same directory (docker-compose's own env-file support,
      # separate from the app's dotenv loading) - paste the real key into .env, not here.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      # Pin the browser origins allowed to call the API. Defaults to '*' inside the app, which is
      # fine over plain HTTP on an IP but should be your real domain in production.
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Capacity knobs. Compose only passes variables that are listed here, so an operator
      # setting one of these in .env needs this line for it to reach the app at all. Defaults
      # come from the code (see backend/services/load_manager.py and gunicorn.conf.py); leaving
      # them unset in .env keeps those measured defaults.
      - MAX_CONCURRENT_ANALYSES=${MAX_CONCURRENT_ANALYSES:-3}
      # Threads PER analysis. 1 is right on a 4-core box, where the cores are already full at
      # 3 concurrent analyses. On 6+ cores there is headroom to give each analysis 2 threads,
      # which roughly halves how long one student waits when they submit alone - measured
      # 3.5s -> 2.2s - without hurting a full-class burst. Keep
      # MAX_CONCURRENT_ANALYSES x TORCH_NUM_THREADS at or below the core count.
      - TORCH_NUM_THREADS=${TORCH_NUM_THREADS:-1}
      - MAX_QUEUED_ANALYSES=${MAX_QUEUED_ANALYSES:-60}
      - ANALYSIS_QUEUE_TIMEOUT=${ANALYSIS_QUEUE_TIMEOUT:-600}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-72}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-60}
      # Rate limits (see app.py). Raise only if a shared-NAT classroom trips them.
      - RATELIMIT_LOGIN_ACCOUNT=${RATELIMIT_LOGIN_ACCOUNT:-10 per 5 minutes}
      - RATELIMIT_LOGIN_IP=${RATELIMIT_LOGIN_IP:-60 per minute}
      - RATELIMIT_REGISTER=${RATELIMIT_REGISTER:-30 per minute;200 per hour}
      - RATELIMIT_DEFAULT=${RATELIMIT_DEFAULT:-10000 per hour}
    depends_on:
      - postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 6.5G, not 8G, on purpose: the target VPS HAS 8 GB in total, and Postgres plus the OS
          # need their share. A limit equal to the whole machine means the kernel OOM-killer
          # picks the victim instead of Docker, and it usually picks Postgres. Measured peak for
          # the app under 60 simultaneous submissions is 4.1 GB, so this leaves real headroom.
          memory: 6656M
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      # - "443:443"   # uncomment once you've issued a certificate (see DEPLOY.md)
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - language-learning-app
    restart: unless-stopped

volumes:
  postgres_data:
  app_uploads:
  certbot_www:
  certbot_conf: